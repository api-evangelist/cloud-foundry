apis:
- aid: cloud-foundry:capi-v3
  name: Cloud Foundry Cloud Controller API v3
  description: The Cloud Controller API (CAPI) v3 is the primary control plane of Cloud Foundry. It manages apps,
    packages, droplets, builds, deployments, processes, tasks, revisions, routes, domains, organizations, spaces,
    roles, security groups, service brokers, offerings, plans, instances and credential bindings. The Cloud Foundry
    Foundation publishes a machine-readable OpenAPI 3.1 description of the surface from the cf-openapi project (158
    paths / 248 operations), rendered at cloudfoundry.github.io/cf-openapi. Requests authenticate with OAuth 2.0
    bearer tokens issued by the UAA server; there is no single public host because every Cloud Foundry foundation
    is self-hosted at its own api.<system-domain>.
  humanURL: https://v3-apidocs.cloudfoundry.org/
