aid: cloud-foundry
name: Cloud Foundry
description: >-
  Cloud Foundry is an open-source, multi-cloud Platform as a Service (PaaS) governed by the Cloud Foundry Foundation. It
  provides a developer-friendly application platform where operators push source code or container images and Cloud
  Foundry handles staging, routing, scaling, and lifecycle management. The CF API (api.cloudfoundry.org) is the primary
  control plane and is documented at v3.cloudfoundry.org/version/release-candidate. The ecosystem also includes the User
  Account and Authentication (UAA) OAuth 2.0 server, the Loggregator log and metric pipeline, the Diego container
  scheduler, the Open Service Broker API for marketplace services, and the Eirini Kubernetes-based scheduler.
