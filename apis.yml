- aid: cloud-foundry:app-autoscaler
  name: Cloud Foundry App Autoscaler API
  description: 'The App Autoscaler is a Cloud Foundry service that automatically scales application instances against
    dynamic metric rules and scheduled windows. The project publishes OpenAPI descriptions for its public surface:
    a Policy API for reading, writing and deleting a per-application scaling policy, a Custom Metrics API for submitting
    application-defined metrics, a Scaling History API for the record of scaling events, and an Application Metric
    API for aggregated metric series.'
