- aid: cloud-foundry:uaa
  name: Cloud Foundry UAA
  tags:
  - Authentication
  - Identity
  - OAuth 2.0
  - Security
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.cloudfoundry.org/uaa/
  properties:
  - url: https://docs.cloudfoundry.org/uaa/
    type: Documentation
  - url: https://github.com/cloudfoundry/uaa
    type: Source Code
  - url: https://docs.cloudfoundry.org/api/uaa/
    type: Reference
  description: >-
    The User Account and Authentication (UAA) server is Cloud Foundry's identity provider and OAuth 2.0
    authorization server. It issues tokens consumed by the Cloud Controller, brokers, and operator tooling,
    and supports SAML and LDAP federation, multifactor authentication, and SCIM-style user and group management.
- aid: cloud-foundry:loggregator
  name: Cloud Foundry Loggregator
  tags:
  - Logs
  - Metrics
  - Observability
  - Streaming
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.cloudfoundry.org/loggregator/
  properties:
  - url: https://docs.cloudfoundry.org/loggregator/
    type: Documentation
  - url: https://github.com/cloudfoundry/loggregator-release
    type: Source Code
  description: >-
    Loggregator is Cloud Foundry's distributed log and metric pipeline that aggregates application logs,
    platform component logs, and metrics for streaming consumption by users and external sinks. It exposes
    a WebSocket Firehose, a v2 gRPC egress API, and the Reverse Log Proxy.
- aid: cloud-foundry:open-service-broker-api
  name: Open Service Broker API
  tags:
  - Marketplace
  - Open Standard
  - Service Broker
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.openservicebrokerapi.org/
  properties:
  - url: https://www.openservicebrokerapi.org/
    type: Documentation
  - url: https://github.com/openservicebrokerapi/servicebroker
    type: Specification
  description: >-
    The Open Service Broker API is the open specification originally developed by Cloud Foundry and now
    used by Kubernetes and other platforms to provision and manage backing services through a common HTTP
    interface. Brokers expose a catalog and lifecycle operations for service instances and bindings.
- aid: cloud-foundry:bosh
  name: BOSH Director API
  tags:
  - Deployment
  - Infrastructure
  - Lifecycle
  - Releases
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://bosh.io/docs/director-api-v1/
  properties:
  - url: https://bosh.io/docs/director-api-v1/
    type: Documentation
  - url: https://github.com/cloudfoundry/bosh
    type: Source Code
  description: >-
    BOSH is Cloud Foundry's release engineering tool for packaging, deploying, and managing distributed
    software. The BOSH Director API exposes deployment, stemcell, release, task, and VM lifecycle operations
    used by operators and CI tooling to manage Cloud Foundry itself and the workloads it depends on.
