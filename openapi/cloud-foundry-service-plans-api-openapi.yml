openapi: 3.2.0
info:
  title: Cloud Foundry V3 Service Plans API
  description: '# Welcome to the Experimental Cloud Foundry V3 API Docs!'
  version: latest
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    name: Cloud Foundry
    url: https://www.cloudfoundry.org/
servers:
- url: https://api.example.local
  description: Cloud Foundry V3 API server
security:
- oauth:
  - cloud_controller.read
  - cloud_controller.write
tags:
- name: Service Plans
  description: Service plans are plans for a service.
paths:
  /v3/service_plans:
    get:
      summary: List service plans
      description: This endpoint retrieves the service plans the user has access to.
      operationId: listServicePlans
      tags:
      - Service Plans
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/OrderBy'
      - name: names
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service plan names to filter by
      - name: available
        in: query
        schema:
          type: boolean
        description: Filter by the `available` property; valid values are `true` or `false`
      - name: service_offering_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service offering guids to filter by
      - name: service_instance_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service instance guids to filter by
      - name: space_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space guids to filter by
      - name: organization_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization guids to filter by
      - name: broker_catalog_ids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of broker catalog IDs to filter by
      - name: service_broker_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service broker GUIDs to filter by
      - name: service_broker_names
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service broker names to filter by
      - name: service_offering_names
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service offering names to filter by
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - space.organization
            - service_offering
        description: Optionally include a list of unique related resources in the response
      - $ref: '#/components/parameters/LabelSelector'
      - name: fields
        in: query
        schema:
          type: object
        description: Fields to include in the response
      - $ref: '#/components/parameters/CreatedAts'
      - $ref: '#/components/parameters/UpdatedAts'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlanList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v3/service_plans/{guid}:
    get:
      summary: Get a service plan
      description: This endpoint retrieves the service plan by GUID.
      operationId: getServicePlan
      tags:
      - Service Plans
      parameters:
      - $ref: '#/components/parameters/Guid'
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - space.organization
            - service_offering
        description: Optionally include a list of unique related resources in the response
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlan'
              examples:
                default:
                  summary: default
                  value:
                    guid: 123e4567-e89b-12d3-a456-426614174000
                    name: my_big_service_plan
                    description: Big
                    visibility_type: public
                    available: true
                    free: false
                    costs:
                    - currency: USD
                      amount: 199.99
                      unit: Monthly
                    created_at: '2019-11-28T13:44:02Z'
                    updated_at: '2019-11-28T13:44:02Z'
                    maintenance_info:
                      version: 1.0.0+dev4
                      description: Database version 7.8.0
                    broker_catalog:
                      id: db730a8c-11e5-11ea-838a-0f4fff3b1cfb
                      metadata:
                        custom-key: custom-information
                      maximum_polling_duration: null
                      features:
                        plan_updateable: true
                        bindable: true
                    schemas:
                      service_instance:
                        create:
                          parameters:
                            $schema: http://json-schema.org/draft-04/schema#
                            type: object
                            properties:
                              billing-account:
                                description: Billing account number used to charge use of shared fake server.
                                type: string
                        update:
                          parameters: {}
                      service_binding:
                        create:
                          parameters: {}
                    relationships:
                      service_offering:
                        data:
                          guid: 123e4567-e89b-12d3-a456-426614174000
                    metadata:
                      labels: {}
                      annotations: {}
                    links:
                      self:
                        href: https://api.example.org/v3/service_plans/bf7eb420-11e5-11ea-b7db-4b5d5e7976a9
                      service_offering:
                        href: https://api.example.org/v3/service_offerings/13c60e38-11e7-11ea-9106-33ee3c5bd4d7
                      visibility:
                        href: https://api.example.org/v3/service_plans/bf7eb420-11e5-11ea-b7db-4b5d5e7976a9/visibility
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a service plan
      description: This endpoint updates a service plan with labels and annotations.
      operationId: updateServicePlan
      tags:
      - Service Plans
      parameters:
      - $ref: '#/components/parameters/Guid'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                metadata:
                  $ref: '#/components/schemas/Metadata'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      summary: Delete a service plan
      description: 'This endpoint deletes a service plan. This is used to remove service plans from the Cloud Foundry database when they

        are no longer provided by the service broker.'
      operationId: deleteServicePlan
      tags:
      - Service Plans
      parameters:
      - $ref: '#/components/parameters/Guid'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/500'
  /v3/service_plans/{guid}/visibility:
    get:
      summary: Get a service plan visibility
      description: This endpoint retrieves the service plan visibility for a given plan.
      operationId: getServicePlanVisibility
      tags:
      - Service Plans
      parameters:
      - $ref: '#/components/parameters/Guid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlanVisibility'
              examples:
                default:
                  summary: default
                  value:
                    type: public
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a service plan visibility
      description: This endpoint updates a service plan visibility. It behaves similar to the POST service plan visibility endpoint but this endpoint will replace the existing list of organizations when the service plan is `organization` visible.
      operationId: updateServicePlanVisibility
      tags:
      - Service Plans
      parameters:
      - $ref: '#/components/parameters/Guid'
      requestBody:
        $ref: '#/components/requestBodies/ServicePlanVisibilityUpdateRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlanVisibility'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      summary: Apply a service plan visibility
      description: This endpoint applies a service plan visibility. It behaves similar to the PATCH service plan visibility endpoint but this endpoint will append to the existing list of organizations when the service plan is `organization` visible.
      operationId: applyServicePlanVisibility
      tags:
      - Service Plans
      parameters:
      - $ref: '#/components/parameters/Guid'
      requestBody:
        $ref: '#/components/requestBodies/ServicePlanVisibilityCreateRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePlanVisibility'
              examples:
                default:
                  summary: default
                  value:
                    type: organization
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v3/service_plans/{guid}/visibility/{organization_guid}:
    delete:
      summary: Remove organization from a service plan visibility
      description: This endpoint removes an organization from a service plan visibility list of organizations. It is only defined for service plans which are org-restricted. It will fail with a HTTP status code of 422 for any other visibility type (e.g. Public).
      operationId: removeOrganizationFromServicePlanVisibility
      tags:
      - Service Plans
      parameters:
      - $ref: '#/components/parameters/Guid'
      - name: organization_guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  schemas:
    IncludedResources:
      type: object
      description: Additional related resources included in the response when using the include parameter
      properties:
        spaces:
          type: array
          items:
            $ref: '#/components/schemas/Space'
          description: Array of included space resources
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
          description: Array of included organization resources
        domains:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
          description: Array of included domain resources
        service_offerings:
          type: array
          items:
            $ref: '#/components/schemas/ServiceOffering'
          description: Array of included service offering resources
        service_instances:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/ManagedServiceInstance'
            - $ref: '#/components/schemas/UserProvidedServiceInstance'
            discriminator:
              propertyName: type
              mapping:
                managed: '#/components/schemas/ManagedServiceInstance'
                user-provided: '#/components/schemas/UserProvidedServiceInstance'
          description: Array of included service instance resources
        apps:
          type: array
          items:
            $ref: '#/components/schemas/App'
          description: Array of included app resources
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
          description: Array of included route resources
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: Array of included user resources
      additionalProperties: false
    Pagination:
      type: object
      properties:
        total_results:
          type: integer
          description: The total number of results available
        total_pages:
          type: integer
          description: The total number of pages available
        first:
          allOf:
          - $ref: '#/components/schemas/Link'
          - description: The first page of results
        last:
          allOf:
          - $ref: '#/components/schemas/Link'
          - description: The last page of results
        next:
          oneOf:
          - $ref: '#/components/schemas/Link'
          - type: 'null'
          description: The next page of results
        previous:
          oneOf:
          - $ref: '#/components/schemas/Link'
          - type: 'null'
          description: The previous page of results
      description: 'Pagination is a technique used to divide a large set of results into smaller, more manageable sets. This allows clients to retrieve results in smaller chunks, reducing the amount of data transferred and improving performance.

        The pagination object is a JSON object that contains information about the pagination state of the results. It includes the total number of results available, the total number of pages available, and links to the first, last, next, and previous pages of results.

        '
    App:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseSchema'
      - properties:
          name:
            type: string
            description: The name of the app
          state:
            type: string
            description: Current desired state of the app
            enum:
            - STOPPED
            - STARTED
          lifecycle:
            $ref: '#/components/schemas/Lifecycle'
            description: Provides the default lifecycle object for the application. This lifecycle will be used when staging and running the application. The staging lifecycle can be overridden on builds
          relationships:
            $ref: '#/components/schemas/Relationships'
          metadata:
            $ref: '#/components/schemas/Metadata'
          links:
            type: object
            properties:
              self:
                $ref: '#/components/schemas/Link'
                description: The URL to get this app
              space:
                $ref: '#/components/schemas/Link'
                description: The URL to get the space for this app
              processes:
                $ref: '#/components/schemas/Link'
                description: The URL to get the processes for this app
              packages:
                $ref: '#/components/schemas/Link'
                description: The URL to get the packages for this app
              environment_variables:
                $ref: '#/components/schemas/Link'
                description: The URL to get the environment variables for this app
              current_droplet:
                $ref: '#/components/schemas/Link'
                description: The URL to get the current droplet for this app
              droplets:
                $ref: '#/components/schemas/Link'
                description: The URL to get the droplets for this app
              tasks:
                $ref: '#/components/schemas/Link'
                description: The URL to get the tasks for this app
              start:
                $ref: '#/components/schemas/Link'
                description: The URL to start the app
              stop:
                $ref: '#/components/schemas/Link'
                description: The URL to stop the app
              revisions:
                $ref: '#/components/schemas/Link'
                description: The URL to get the revisions for this app
              deployed_revisions:
                $ref: '#/components/schemas/Link'
                description: The URL to get the deployed revisions for this app
              features:
                $ref: '#/components/schemas/Link'
                description: The URL to get the features for this app
          included:
            $ref: '#/components/schemas/IncludedResources'
            description: Additional related resources included in the response when using the include parameter
      description: 'Apps represent the core entities in the Cloud Foundry environment. They are the deployable units that run your code. Each app can have multiple processes, routes, and services associated with it. Apps can be scaled horizontally by increasing the number of instances. They can also be updated and restarted as needed.

        '
    ServiceInstanceLastOperation:
      type: object
      properties:
        type:
          type: string
          description: Type of the last operation
          enum:
          - create
          - update
          - delete
        state:
          type: string
          description: State of the last operation
          enum:
          - initial
          - in progress
          - succeeded
          - failed
        description:
          type:
          - string
          - 'null'
          description: A textual explanation associated with this state
        created_at:
          type: string
          format: date-time
          description: When the last operation was created
        updated_at:
          type: string
          format: date-time
          description: When the last operation was last updated
      description: The last operation object for service instances
    Link:
      type: object
      properties:
        href:
          type: string
          description: The URL of the link
        method:
          type: string
          description: An optional field containing the HTTP method to be used when following the URL
      required:
      - href
      description: 'Each link is keyed by its type and will include a href for the URL and an optional method for links that cannot be followed using GET.

        '
    RelationshipToOne:
      type: object
      properties:
        data:
          type:
          - object
          - 'null'
          $ref: '#/components/schemas/Relationship'
        links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
            related:
              $ref: '#/components/schemas/Link'
      description: 'Some relationships relate a resource to exactly one other resource. For example an app can belong to only one space.

        '
    ManagedServiceInstance:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseSchema'
      - properties:
          type:
            type: string
            enum:
            - managed
            description: Type of service instance
          name:
            type: string
            description: Name of the service instance
          tags:
            type: array
            items:
              type: string
            description: Tags for the service instance
          syslog_drain_url:
            type:
            - string
            - 'null'
            format: uri
            description: URL for syslog drain
          route_service_url:
            type:
            - string
            - 'null'
            format: uri
            description: URL for route service
          dashboard_url:
            type:
            - string
            - 'null'
            format: uri
            description: URL for service dashboard
          maintenance_info:
            type: object
            properties:
              version:
                type: string
                description: Version of maintenance info
              description:
                type:
                - string
                - 'null'
                description: Description of maintenance info
          upgrade_available:
            type: boolean
            description: Whether an upgrade is available
          last_operation:
            $ref: '#/components/schemas/ServiceInstanceLastOperation'
          relationships:
            type: object
            properties:
              space:
                $ref: '#/components/schemas/RelationshipToOne'
              service_plan:
                $ref: '#/components/schemas/RelationshipToOne'
            description: Relationships for the service instance
          links:
            type: object
            properties:
              self:
                $ref: '#/components/schemas/Link'
              space:
                $ref: '#/components/schemas/Link'
              service_plan:
                $ref: '#/components/schemas/Link'
              parameters:
                $ref: '#/components/schemas/Link'
              service_credential_bindings:
                $ref: '#/components/schemas/Link'
              service_route_bindings:
                $ref: '#/components/schemas/Link'
              shared_spaces:
                $ref: '#/components/schemas/Link'
          metadata:
            $ref: '#/components/schemas/Metadata'
        required:
        - type
        - name
        - relationships
        - links
    Domain:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseSchema'
      - properties:
          name:
            type: string
            description: The name of the domain; must be between 3 ~ 253 characters and follow [RFC 1035](https://tools.ietf.org/html/rfc1035)
          internal:
            type: boolean
            description: Whether the domain is used for internal (container-to-container) traffic
          router_group:
            type:
            - object
            - 'null'
            properties:
              guid:
                type: string
                format: uuid
            description: The guid of the desired router group to route `tcp` traffic through; if set, the domain will only be available for `tcp` traffic
          supported_protocols:
            type: array
            items:
              type: string
              enum:
              - http
              - tcp
            description: Available protocols for routes using the domain, currently `http` and `tcp`
          relationships:
            $ref: '#/components/schemas/Relationships'
          metadata:
            $ref: '#/components/schemas/Metadata'
          links:
            type: object
            properties:
              self:
                $ref: '#/components/schemas/Link'
                description: The URL to get this domain
              organization:
                $ref: '#/components/schemas/Link'
                description: The URL to get the organization for this domain
              route_reservations:
                $ref: '#/components/schemas/Link'
                description: The URL to get the route reservations for this domain
              shared_organizations:
                $ref: '#/components/schemas/Link'
                description: The URL to get the shared organizations for this domain
              router_group:
                $ref: '#/components/schemas/Link'
                description: The URL to get the router group for this domain
      description: 'A domain is a fully qualified domain name that is used for application routes. A domain can be scoped to an organization, meaning it can be used to create routes for spaces inside that organization, or be left unscoped to allow all organizations access.

        '
    Organization:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseSchema'
      - properties:
          name:
            type: string
            description: Name of the organization
          suspended:
            type: boolean
            description: Whether an organization is suspended or not; non-admins will be blocked from creating, updating, or deleting resources in a suspended organization
          relationships:
            type: object
            properties:
              quota:
                $ref: '#/components/schemas/RelationshipToOne'
            description: The quota applied to the organization
          metadata:
            $ref: '#/components/schemas/Metadata'
          links:
            type: object
            properties:
              self:
                $ref: '#/components/schemas/Link'
                description: The URL to get this organization
              domains:
                $ref: '#/components/schemas/Link'
                description: The URL to get the domains for this organization
              quota:
                $ref: '#/components/schemas/Link'
                description: The URL to get the quota for this organization
              default_domain:
                $ref: '#/components/schemas/Link'
                description: The URL to get the default domain for this organization
      description: 'An org is a development account that an individual or multiple collaborators can own and use. All collaborators access an org with user accounts. Collaborators in an org share a resource quota plan, applications, services availability, and custom domains.

        '
    Relationships:
      type: object
      description: 'Relationships represent associations between resources. When relationships are mutable, they can be used to create, read, update, and delete these associations. An app’s relationship to its current droplet is mutable, but an app’s relationship to its space is not.


        Relationships do not affect the fundamental properties of a resource, but may affect their behavior and permissions logic. Relationships are tied to the lifecycles of the associated resources and will be removed if either of the associated resources are deleted. For example, if a user is removed from an organization, both the user and the organization persist, but the relationship between them does not.


        Not all resources implement every relationship operation demonstrated in the examples below. See the docs for each resource to see how it interacts with its relationships.


        Endpoints that return relationship data list this information under the relationships key.


        The relationship object

        The relationship object is a key-value pair that uniquely identifies a resource. In practice this is almost always the guid of a resource.

        '
    Lifecycle:
      type: object
      properties:
        type:
          type: string
          description: Type of the lifecycle; valid values are buildpack, cnb, docker
        data:
          type: object
          additionalProperties: true
          description: Data specific to the lifecycle
          properties:
            buildpacks:
              type: array
              items:
                type: string
              description: List of the names of buildpacks, URLs from which they may be downloaded, or null to auto-detect a suitable buildpack during staging (applicable for buildpack and cnb lifecycles)
            stack:
              type:
              - string
              - 'null'
              description: The root filesystem to use with the buildpack, for example cflinuxfs4 (applicable for buildpack lifecycle)
            credentials:
              type: object
              additionalProperties:
                type: object
                properties:
                  username:
                    type:
                    - string
                    - 'null'
                  password:
                    type:
                    - string
                    - 'null'
                  token:
                    type: string
              description: Credentials used to download the configured buildpacks (applicable for cnb lifecycle)
      description: 'The lifecycle type defines how the application droplet is created and run. The following lifecycle types are supported: - buildpack: Traditional buildpacks for Cloud Foundry applications. - cnb: Cloud Native Buildpacks that are OCI-compliant. - docker: Run pre-built Docker images.

        '
    ServiceOffering:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseSchema'
      - properties:
