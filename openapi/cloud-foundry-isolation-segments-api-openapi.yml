openapi: 3.2.0
info:
  title: Cloud Foundry V3 Isolation Segments API
  description: '# Welcome to the Experimental Cloud Foundry V3 API Docs!'
  version: latest
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    name: Cloud Foundry
    url: https://www.cloudfoundry.org/
servers:
- url: https://api.example.local
  description: Cloud Foundry V3 API server
security:
- oauth:
  - cloud_controller.read
  - cloud_controller.write
tags:
- name: Isolation Segments
  description: Isolation Segments provide dedicated pools of resources to which apps can be deployed to isolate workloads.
paths:
  /v3/isolation_segments:
    get:
      summary: List isolation segments
      description: Retrieves all isolation segments to which the user has access. For admin, this is all the isolation segments in the system. For anyone else, this is the isolation segments in the allowed list for any organization to which the user belongs.
      operationId: listIsolationSegments
      tags:
      - Isolation Segments
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/OrderBy'
      - $ref: '#/components/parameters/CreatedAts'
      - $ref: '#/components/parameters/UpdatedAts'
      - $ref: '#/components/parameters/LabelSelector'
      - name: guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of isolation segment guids to filter by.
      - name: names
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of isolation segment names to filter by.
      - name: organization_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization guids to filter by.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsolationSegmentList'
              examples:
                default:
                  summary: default
                  value:
                    pagination:
                      total_results: 11
                      total_pages: 3
                      first:
                        href: https://api.example.org/v3/isolation_segments?page=1&per_page=5
                      last:
                        href: https://api.example.org/v3/isolation_segments?page=3&per_page=5
