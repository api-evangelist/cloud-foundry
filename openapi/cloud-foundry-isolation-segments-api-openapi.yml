  /v3/isolation_segments/{guid}:
    get:
      summary: Get an isolation segment
      description: Retrieve an isolation segment to which the user has access. For admin, this is any isolation segment in the system. For anyone else, this is an isolation segment in the allowed list for any organization to which the user belongs.
      operationId: getIsolationSegment
      tags:
      - Isolation Segments
      parameters:
      - $ref: '#/components/parameters/Guid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsolationSegment'
              examples:
                default:
                  summary: default
                  value:
                    guid: 123e4567-e89b-12d3-a456-426614174000
                    name: an_isolation_segment
                    created_at: '2016-10-19T20:25:04Z'
                    updated_at: '2016-11-08T16:41:26Z'
                    links:
                      self:
                        href: https://api.example.org/v3/isolation_segments/b19f6525-cbd3-4155-b156-dc0c2a431b4c
                      organizations:
                        href: https://api.example.org/v3/isolation_segments/b19f6525-cbd3-4155-b156-dc0c2a431b4c/organizations
                    metadata:
                      annotations: {}
                      labels: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update an isolation segment
      description: Update an isolation segment.
      operationId: updateIsolationSegment
      tags:
      - Isolation Segments
      parameters:
      - $ref: '#/components/parameters/Guid'
      requestBody:
        description: Isolation segment to update
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the isolation segment
                metadata:
                  $ref: '#/components/schemas/Metadata'
            examples:
              default:
                summary: default
                value:
                  name: my_isolation_segment
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsolationSegment'
              examples:
                default:
                  summary: default
                  value:
                    guid: 123e4567-e89b-12d3-a456-426614174000
                    name: <%= name %>
                    created_at: '2016-10-19T20:25:04Z'
                    updated_at: '2016-11-08T16:41:26Z'
                    links:
                      self:
                        href: https://api.example.org/v3/isolation_segments/b19f6525-cbd3-4155-b156-dc0c2a431b4c
                      organizations:
                        href: https://api.example.org/v3/isolation_segments/b19f6525-cbd3-4155-b156-dc0c2a431b4c/organizations
                    metadata:
                      annotations: {}
                      labels: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
