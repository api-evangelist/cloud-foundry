        '
      example: '2021-01-01T00:00:00Z'
    Guid:
      name: guid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The unique identifier for the resource
  requestBodies:
    SpaceQuotaUpdate:
      description: Space quota to update
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Name of the space quota
              apps:
                type: object
                properties:
                  total_memory_in_mb:
                    type: integer
                    description: Total memory allowed for all apps in MB
                  per_process_memory_in_mb:
                    type: integer
                    description: Maximum memory per process in MB
                  log_rate_limit_in_bytes_per_second:
                    type: integer
                    description: Log rate limit in bytes per second
                  total_instances:
                    type: integer
                    description: Total number of app instances allowed
                  per_app_tasks:
                    type: integer
                    description: Maximum number of tasks per app
                description: App limits for the space quota
              services:
                type: object
                properties:
                  paid_services_allowed:
                    type: boolean
                    description: Whether paid services are allowed
                  total_service_instances:
                    type: integer
                    description: Total number of service instances allowed
                  total_service_keys:
                    type: integer
                    description: Total number of service keys allowed
                description: Service limits for the space quota
              routes:
                type: object
                properties:
                  total_routes:
                    type: integer
                    description: Total number of routes allowed
                  total_reserved_ports:
                    type: integer
                    description: Total number of reserved ports allowed
                description: Route limits for the space quota
              metadata:
                $ref: '#/components/schemas/Metadata'
    SpaceQuotaCreate:
      description: Space quota to create
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Name of the space quota
              apps:
                type: object
                properties:
                  total_memory_in_mb:
                    type: integer
                    description: Total memory allowed for all apps in MB
                  per_process_memory_in_mb:
                    type: integer
                    description: Maximum memory per process in MB
                  log_rate_limit_in_bytes_per_second:
                    type: integer
                    description: Log rate limit in bytes per second
                  total_instances:
                    type: integer
                    description: Total number of app instances allowed
                  per_app_tasks:
                    type: integer
                    description: Maximum number of tasks per app
                description: App limits for the space quota
              services:
                type: object
                properties:
                  paid_services_allowed:
                    type: boolean
                    description: Whether paid services are allowed
                  total_service_instances:
                    type: integer
                    description: Total number of service instances allowed
                  total_service_keys:
                    type: integer
                    description: Total number of service keys allowed
                description: Service limits for the space quota
              routes:
                type: object
                properties:
                  total_routes:
                    type: integer
                    description: Total number of routes allowed
                  total_reserved_ports:
                    type: integer
                    description: Total number of reserved ports allowed
                description: Route limits for the space quota
              relationships:
                type: object
                properties:
                  organization:
                    $ref: '#/components/schemas/RelationshipToOne'
                  spaces:
                    $ref: '#/components/schemas/RelationshipToMany'
                description: Relationships for the space quota
              metadata:
                $ref: '#/components/schemas/Metadata'
            required:
            - name
          examples:
            default:
              summary: default
              value:
                name: production
                relationships:
                  organization:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://uaa.cloudfoundry.local/api-oauth/dialog
          scopes:
            cloud_controller.admin: This scope provides read and write access to all resources
            cloud_controller.admin_read_only: This scope provides read only access to all resources
            cloud_controller.global_auditor: This scope provides read access to all resources
            cloud_controller.read: Read access to the Cloud Controller
            cloud_controller.write: Write access to the Cloud Controller
            cloud_controller.update_build_state: This scope allows its bearer to update the state of a build; currently only used when updating builds
            cloud_controller_service_permissions.read: This scope provides read only access for service instance permissions
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT token authentication
