openapi: 3.2.0
info:
  title: Cloud Foundry V3 Packages API
  description: '# Welcome to the Experimental Cloud Foundry V3 API Docs!'
  version: latest
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    name: Cloud Foundry
    url: https://www.cloudfoundry.org/
servers:
- url: https://api.example.local
  description: Cloud Foundry V3 API server
security:
- oauth:
  - cloud_controller.read
  - cloud_controller.write
tags:
- name: Packages
  description: A package is an application’s ‘source code’; either raw bits for your application or a pointer to these bits.
paths:
  /v3/packages:
    get:
      summary: List packages
      description: Retrieve all packages.
      operationId: listPackages
      tags:
      - Packages
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/OrderBy'
      - $ref: '#/components/parameters/CreatedAts'
      - $ref: '#/components/parameters/UpdatedAts'
      - $ref: '#/components/parameters/LabelSelector'
      - name: guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of package guids to filter by
      - name: states
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - AWAITING_UPLOAD
            - PROCESSING_UPLOAD
            - READY
            - FAILED
            - COPYING
            - EXPIRED
        description: Comma-delimited list of package states to filter by
      - name: types
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - bits
            - docker
        description: Comma-delimited list of package types to filter by
      - name: app_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of app guids to filter by
      - name: space_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space guids to filter by
      - name: organization_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization guids to filter by
      responses:
        '200':
          description: List of packages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageList'
              examples:
                default:
                  summary: default
                  value:
                    pagination:
                      total_results: 2
                      total_pages: 1
                      first:
                        href: https://api.example.org?types=bits%2Cdocker&page=1&per_page=2
                      last:
                        href: https://api.example.org?types=bits%2Cdocker&page=1&per_page=2
                      next: null
                      previous: null
                    resources:
                    - guid: 123e4567-e89b-12d3-a456-426614174000
                      type: bits
                      data:
                        checksum:
                          type: sha256
                          value: null
                        error: null
                      state: AWAITING_UPLOAD
                      created_at: '2015-11-03T00:53:54Z'
                      updated_at: '2016-06-08T16:41:26Z'
                      relationships:
                        app:
                          data:
                            guid: 123e4567-e89b-12d3-a456-426614174000
                      links:
                        self:
                          href: https://api.example.org/v3/packages/a57fd932-85db-483a-a27e-b00efbb3b0a4
                        upload:
                          href: https://api.example.org/v3/packages/a57fd932-85db-483a-a27e-b00efbb3b0a4/upload
                          method: POST
                        download:
                          href: https://api.example.org/v3/packages/a57fd932-85db-483a-a27e-b00efbb3b0a4/download
                          method: GET
                        app:
                          href: https://api.example.org/v3/apps/fa3558ce-1c4d-46fc-9776-54b9c8021745
                      metadata:
                        labels: {}
                        annotations: {}
                    - guid: 123e4567-e89b-12d3-a456-426614174000
                      type: docker
                      data:
                        image: registry/image:latest
                        username: username
                        password: '***'
                      state: READY
                      created_at: '2015-11-03T00:53:54Z'
                      updated_at: '2016-06-08T16:41:26Z'
                      relationships:
                        app:
                          data:
                            guid: 123e4567-e89b-12d3-a456-426614174000
                      links:
                        self:
                          href: https://api.example.org/v3/packages/8f1f294d-cef8-4c11-9f0b-3bcdc0bd2691
                        app:
                          href: https://api.example.org/v3/apps/fa3558ce-1c4d-46fc-9776-54b9c8021745
                      metadata:
                        labels: {}
                        annotations: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      summary: Create a package
      description: Create a package.
      operationId: createPackage
      tags:
      - Packages
      requestBody:
        $ref: '#/components/requestBodies/PackageCreateRequestBody'
      responses:
        '201':
          description: Successfully created package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
              examples:
                docker_app:
                  summary: Docker app
                  value:
                    guid: 123e4567-e89b-12d3-a456-426614174000
                    type: docker
                    data:
                      image: registry/image:latest
                      username: username
                      password: '***'
                    state: READY
                    created_at: '2015-11-03T00:53:54Z'
                    updated_at: '2016-06-08T16:41:26Z'
                    relationships:
                      app:
                        data:
                          guid: 123e4567-e89b-12d3-a456-426614174000
                    links:
                      self:
                        href: https://api.example.org/v3/packages/4cb65058-f04f-458f-aca1-5f4e43de6407
                      app:
                        href: https://api.example.org/v3/apps/d8b8148d-5798-44de-821a-64b85b15e968
                    metadata:
                      labels: {}
                      annotations: {}
          links:
            app:
              operationId: getApp
              parameters:
                guid: $response.body#/relationships/app/data/guid
              description: Retrieve the app for this package
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v3/packages/{guid}:
    get:
      summary: Get a package
      description: Retrieve a package.
      operationId: getPackage
      tags:
      - Packages
      parameters:
      - $ref: '#/components/parameters/Guid'
      responses:
        '200':
          description: Successfully retrieved package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
          links:
            app:
              operationId: getApp
              parameters:
                guid: $response.body#/relationships/app/data/guid
              description: Retrieve the app for this package
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      summary: Update a package
      description: Update a package.
      operationId: updatePackage
      tags:
      - Packages
      parameters:
      - $ref: '#/components/parameters/Guid'
      requestBody:
        description: Package object that needs to be updated
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  $ref: '#/components/schemas/Metadata'
                username:
                  type: string
                  description: The username for the image’s registry. Only possible for Docker package.
                password:
                  type: string
                  description: The password for the image’s registry. Only possible for Docker package.
            examples:
              default:
                summary: default
                value:
                  metadata:
                    labels:
                      key: value
                    annotations:
                      note: detailed information
      responses:
        '200':
          description: Successfully updated package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      summary: Delete a package
      description: Delete a package.
      operationId: deletePackage
      tags:
      - Packages
      parameters:
      - $ref: '#/components/parameters/Guid'
      responses:
        '202':
          description: Accepted
          headers:
            Location:
              description: URL of the job that is deleting the package
              schema:
                type: string
                format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/500'
  /v3/packages/{guid}/droplets:
    get:
      summary: List droplets for a package
      description: Retrieve a list of droplets belonging to a package.
      operationId: listPackageDroplets
      tags:
      - Packages
      parameters:
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/OrderBy'
      - $ref: '#/components/parameters/LabelSelector'
      - name: guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of droplet guids to filter by
      - name: states
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of droplet states to filter by
      responses:
        '200':
          description: List of droplets for the package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DropletList'
              examples:
                default:
                  summary: default
                  value:
                    pagination:
                      total_results: 2
                      total_pages: 1
                      first:
                        href: https://api.example.org?page=1&per_page=50
                      last:
                        href: https://api.example.org?page=1&per_page=50
                      next: null
                      previous: null
                    resources:
                    - guid: 123e4567-e89b-12d3-a456-426614174000
                      state: STAGED
                      error: null
                      lifecycle:
                        type: buildpack
                        data: {}
                      image: null
                      execution_metadata: PRIVATE DATA HIDDEN
                      process_types:
                        redacted_message: 123e4567-e89b-12d3-a456-426614174000
                      checksum:
                        type: sha256
                        value: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
                      buildpacks:
                      - name: ruby_buildpack
                        detect_output: ruby 1.6.14
                        version: 1.1.1.
                        buildpack_name: ruby
                      stack: cflinuxfs4
                      created_at: '2016-03-28T23:39:34Z'
                      updated_at: '2016-03-28T23:39:47Z'
                      relationships:
                        app:
                          data:
                            guid: 123e4567-e89b-12d3-a456-426614174000
                      links:
                        self:
                          href: https://api.example.org/v3/droplets/585bc3c1-3743-497d-88b0-403ad6b56d16
                        package:
