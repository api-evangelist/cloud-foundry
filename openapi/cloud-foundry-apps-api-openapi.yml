          additionalProperties:
            type:
            - string
            - 'null'
        links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
              description: The URL to get the environment variables for this app
            app:
              $ref: '#/components/schemas/Link'
              description: The URL to get the app for these environment variables
      description: App environment variables with links
    ServiceInstanceLastOperation:
      type: object
      properties:
        type:
          type: string
          description: Type of the last operation
          enum:
          - create
          - update
          - delete
        state:
          type: string
          description: State of the last operation
          enum:
          - initial
          - in progress
          - succeeded
          - failed
        description:
          type:
          - string
          - 'null'
          description: A textual explanation associated with this state
        created_at:
          type: string
          format: date-time
          description: When the last operation was created
        updated_at:
          type: string
          format: date-time
          description: When the last operation was last updated
      description: The last operation object for service instances
    AppEnvironment:
      type: object
