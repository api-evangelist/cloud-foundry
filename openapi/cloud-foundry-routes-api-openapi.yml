        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    RouteListResponse:
      description: A list of routes
      content:
        application/json:
          schema:
            type: object
            properties:
              pagination:
                $ref: '#/components/schemas/Pagination'
              resources:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
        text/html:
          schema:
            type: string
    ServiceUnavailable:
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
  parameters:
    OrderBy:
      name: order_by
      in: query
      required: false
      schema:
        type: string
      description: 'Value to sort by. Defaults to ascending; prepend with `-` to sort descending.

        '
      example: created_at
    CreatedAts:
      name: created_ats
      in: query
      required: false
      schema:
        type: string
      description: 'Timestamp to filter by. When filtering on equality, several comma-delimited timestamps may be passed. Also supports filtering with [relational operators](#relational-operators).

        '
      example: '2021-01-01T00:00:00Z'
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
      description: Number of results per page, valid values are 1 through 5000
      example: 50
    LabelSelector:
      name: label_selector
      in: query
      description: A query string containing a list of [label selector](#labels-and-selectors) requirements
      required: false
      schema:
        type: string
      example: environment=production
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
      description: Page to display; valid values are integers >= 1
      example: 1
    UpdatedAts:
      name: updated_ats
      in: query
      required: false
      schema:
        type: string
      description: 'Timestamp to filter by. When filtering on equality, several comma-delimited timestamps may be passed. Also supports filtering with [relational operators](#relational-operators).

        '
      example: '2021-01-01T00:00:00Z'
    Guid:
      name: guid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The unique identifier for the resource
  requestBodies:
    RouteDestinations:
      description: A list of route destinations
      content:
        application/json:
          schema:
            type: object
            properties:
              destinations:
                type: array
                items:
                  $ref: '#/components/schemas/RouteDestination'
                description: List of destinations to add to route; destinations without `process.type` specified will get process type `"web"` by default
          examples:
            default:
              summary: default
              value:
                destinations:
                - app:
                    guid: 123e4567-e89b-12d3-a456-426614174000
                  weight: 61
                - app:
                    guid: 123e4567-e89b-12d3-a456-426614174000
                    process:
                      type: api
                  weight: 39
                  port: 9000
                  protocol: http1
    RouteCreateRequestBody:
      description: Route to create
      content:
        application/json:
          schema:
            type: object
            properties:
              host:
                type: string
                description: The host component for the route; not compatible with routes specifying the `tcp` protocol
              path:
                type: string
                description: The path component for the route; should begin with a `/` and not compatible with routes specifying the `tcp` protocol
              port:
                type: integer
                description: The port the route will listen on; only compatible with routes leveraging a domain that supports the `tcp` protocol. For `tcp` domains, a port will be randomly assigned if not specified
              relationships:
                type: object
                properties:
                  domain:
                    $ref: '#/components/schemas/RelationshipToOne'
                    description: A relationship to the domain of the route
                  space:
                    $ref: '#/components/schemas/RelationshipToOne'
                    description: A relationship to the space containing the route; routes can only be mapped to destinations in that space
              metadata:
                $ref: '#/components/schemas/Metadata'
            required:
            - relationships
          examples:
            default:
              summary: default
              value:
                host: a-hostname
                path: /some_path
                port: 6666
                relationships:
                  domain:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                  space:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                options:
                  loadbalancing: round-robin
                metadata:
                  labels:
                    key: value
                  annotations:
                    note: detailed information
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://uaa.cloudfoundry.local/api-oauth/dialog
          scopes:
            cloud_controller.admin: This scope provides read and write access to all resources
            cloud_controller.admin_read_only: This scope provides read only access to all resources
            cloud_controller.global_auditor: This scope provides read access to all resources
            cloud_controller.read: Read access to the Cloud Controller
            cloud_controller.write: Write access to the Cloud Controller
            cloud_controller.update_build_state: This scope allows its bearer to update the state of a build; currently only used when updating builds
            cloud_controller_service_permissions.read: This scope provides read only access for service instance permissions
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT token authentication
