problem_types:
- name: CF-NotAuthenticated
  status: 401
  title: Unauthorized
  reason: No bearer token, an expired token, or a token UAA will not validate.
  remediation: >-
    Re-authenticate against the foundation's UAA (uaa.<system-domain>) and retry once. Do not retry in a
    loop — unauthenticated requests are counted against a SEPARATE, much smaller rate-limit bucket.
