scheme: semver
note: >-
  Cloud Foundry has no single product changelog because it is not a single product. The Cloud Controller API
  changes ship as dated capi-release versions (roughly weekly), the API reference is published as an
  immutable per-version site at v3-apidocs.cloudfoundry.org/version/<capi-version>/, and the cf CLI has its
  own semver line. The API surface itself is versioned by PATH (/v3) and never by header or date — the
  release numbers below track the implementation, not a new API version.
