note: 'Cloud Foundry publishes NO /.well-known/ documents on any host it controls. Every named path 404s on cloudfoundry.org,
  www.cloudfoundry.org, docs.cloudfoundry.org, v3-apidocs.cloudfoundry.org, cloudfoundry.github.io, bosh.io and
  www.openservicebrokerapi.org. api.cloudfoundry.org — the host carried in the servers[] block of the older derived
  specs in openapi/ — answers 530 (Cloudflare origin unreachable) on every path, because Cloud Foundry is self-hosted:
  there is no single public foundation and api.<system-domain> differs per deployment. A running foundation DOES
  serve UAA discovery at https://uaa.<system-domain>/.well-known/openid-configuration, but that is an operator-deployed
  endpoint, not a document the Foundation publishes, so it is not recorded as a hit. NO WellKnown or SecurityTxt
  pointer is emitted from this file — every probe is an absence. The Foundation DOES run a coordinated vulnerability
  disclosure programme, just not via security.txt; see security/cloud-foundry-vulnerability-disclosure.yml.'
