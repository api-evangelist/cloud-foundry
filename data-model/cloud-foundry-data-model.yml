note: Derived from the Cloud Foundry Foundation's own OpenAPI 3.1 description of the Cloud Controller API v3. CAPI
  v3 expresses EVERY association through a `relationships` object rather than bare foreign keys — {"relationships":{"space":{"data":{"guid":"..."}}}}
  — which is the defining structural change from the v2 API and is codified in cloudfoundry/cc-api-v3-style-guide.
  Related objects can be side-loaded with the `include` query parameter into an `included` block, so a traversal
  that would be N+1 in v2 is one call in v3. Every resource carries guid, created_at, updated_at and links; most
  carry metadata.labels / metadata.annotations, which are queryable via label_selector.
identity:
  primary_key: guid
  format: UUID
  timestamps:
  - created_at
  - updated_at
  note: GUIDs are opaque UUIDs with no type prefix — unlike prefix-encoded ids elsewhere, a bare Cloud Foundry GUID
    does not tell you what it points at. Type comes from the path you fetched it from.
containment_hierarchy:
- Organization
- Space
- App
- Process / Package / Droplet / Build / Deployment / Revision / Task / Sidecar
containment_note: Organizations contain Spaces contain Apps. Deleting a parent cascades to every child, and there
  is no restore — see the reversibility block in conventions/. Quotas attach at Organization (OrganizationQuota)
  and Space (SpaceQuota) level.
