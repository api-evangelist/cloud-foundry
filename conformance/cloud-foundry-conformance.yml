    the project's own cc-api-v3-style-guide (github.com/cloudfoundry/cc-api-v3-style-guide), but it does not
    claim or implement the JSON:API media type.
- id: idempotency
  conforms: false
  evidence: >-
    No Idempotency-Key header appears anywhere in the 248-operation CAPI spec. Long-running mutations return
